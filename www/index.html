<style>
:root{--bg:#101826;--s:#19243a;--s2:#223150;--ac:#ffb703;--tx:#eef2f7;--mu:#8fa0ba;--ok:#5fd0a0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 Tahoma,"Segoe UI",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 calc(66px + env(safe-area-inset-bottom))}
h1{font-size:22px;margin:.4em 0}h2{font-size:18px;margin:.4em 0}h3{font-size:16px;color:var(--ac);margin:.4em 0}
main{padding:12px 14px;max-width:640px;margin:auto}
nav{position:fixed;bottom:0;inset-inline:0;display:flex;background:var(--s);padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--s2)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:8px 2px;font:inherit;font-size:12px}
nav button b{display:block;font-size:22px;line-height:1.2}nav button.on{color:var(--ac);font-weight:700}
input{font:inherit;color:var(--tx);background:var(--s);border:1px solid var(--s2);border-radius:10px;padding:10px;width:100%}
.b{font:inherit;background:var(--ac);color:#101826;font-weight:700;border:0;border-radius:10px;padding:12px;width:100%;margin-top:10px}
.b.g{background:var(--s2);color:var(--tx)}
.row{display:flex;gap:8px}.row>*{flex:1}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 2px}
.card{background:var(--s);border-radius:14px;padding:12px;margin:10px 0}
.ex{display:flex;gap:10px;align-items:center;background:var(--s);border-radius:12px;padding:8px;margin:8px 0}
.ex img{width:60px;height:60px;border-radius:8px;object-fit:cover;background:#fff}
.ex .t{flex:1}.ex b{display:block;direction:ltr;text-align:start;font-size:14px}.ex small{color:var(--mu)}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--mu);background:none;color:#101826;font-size:16px}.ck.on{background:var(--ok);border-color:var(--ok)}
.goal{display:flex;gap:8px;background:var(--s);border:2px solid var(--s);border-radius:14px;padding:8px;margin:10px 0;align-items:center}
.goal.on{border-color:var(--ac)}.goal .im{display:flex;gap:2px}.goal img{width:64px;height:64px;object-fit:cover;background:#fff;border-radius:6px}
.goal small{color:var(--mu);display:block;line-height:1.4}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}.pills span{background:var(--s);padding:6px 14px;border-radius:99px;font-size:14px}.pills span.on{background:var(--ac);color:#101826;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal i{font-style:normal;color:var(--mu);font-size:12px}
.cal div{aspect-ratio:1;border-radius:10px;background:var(--s);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px}
.cal div.p{border:1.5px dashed var(--ac)}.cal div.d{background:var(--ok);color:#101826;font-weight:700;border:0}
.cal div.t{outline:2px solid var(--tx)}.cal div.s{background:var(--ac);color:#101826;border:0}
.cal div u{font-size:10px;text-decoration:none}
.hero{width:48%;aspect-ratio:1;object-fit:cover;background:#fff;border-radius:12px}
.note{font-size:12px;color:var(--mu)}.hd{display:flex;justify-content:space-between;align-items:center}
.hd button{background:var(--s);border:0;color:var(--tx);border-radius:10px;padding:6px 14px;font-size:18px}
.ld p{opacity:0;animation:f .5s forwards}@keyframes f{to{opacity:1}}
.tag{background:var(--ac);color:#101826;border-radius:99px;padding:0 8px;font-size:11px;font-weight:700}

const $=s=>document.querySelector(s),L=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},S=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const byId=Object.fromEntries(EX.map(e=>[e[0],e])),LV={beginner:1,intermediate:2,expert:3};
let C=L('cfg',null),lang=(C&&C.lang)||L('lang','de'),st=0,P=L('draft',{sex:'m',age:25,w:75,h:175,goal:'mass',lv:1,where:'gym',days:[0,2,4]}),tab='cal',sel=new Date(),vm=new Date(),cat='',C0;
const t=k=>T[lang][k],fd=n=>lang=='fa'?(+n).toLocaleString('fa-IR',{useGrouping:false}):n,fi=lang=>lang=='fa'?1:0;

function setLang(l){lang=l;S('lang',l);if(C){C.lang=l;S('cfg',C)}render()}
function rd(){if($('#age')){P.age=+$('#age').value||25;P.w=+$('#w').value||70;P.h=+$('#h').value||170}S('draft',P)}
function setP(k,v){rd();P[k]=typeof P[k]=='number'?+v:v;S('draft',P);render()}
function pills(arr,cur,fn){return `<div class="pills">${arr.map(([v,n])=>`<span class="${v==cur?'on':''}" onclick="${fn.replace('$v',v)}">${n}</span>`).join('')}</div>`}

 if(!C){$('#nav').innerHTML='';return onboard()}
 $('#nav').innerHTML=[['cal','📅',t('cal')],['sup','💊',t('sup')],['me','👤',t('me')]].map(([k,i,n])=>`<button class="${k==tab?'on':''}" onclick="tab='${k}';render()"><b>${i}</b>${n}</button>`).join('');
 ({cal:vCal,sup:vSup,me:vMe})[tab]();scrollTo(0,0)}
function exRow(e,chk){return `<div class="ex"><img loading="lazy" src="${im(e)}" onclick="detail('${e[0]}')"><div class="t" onclick="detail('${e[0]}')"><b>${e[1]}</b><small>${MU[lang][e[3]]||e[3]} · ${EQ[lang][e[2]]||e[2]}</small></div>${chk||''}</div>`}
// ---------- Onboarding
function onboard(){let h='';
 const nav=(js,label)=>`<div class="row">${st?`<button class="b g" onclick="rd();st--;render()">${t('back')}</button>`:''}<button class="b" onclick="${js||'rd();st++;render()'}">${label||t('next')}</button></div>`;
 const LG=[['de','Deutsch'],['fa','فارسی']];
 if(st==0)h=`<h1>🏋️ ${t('hi')}</h1><label>🌐 ${t('lang')}</label>${pills(LG,lang,"setLang('$v')")}`+nav();
 if(st==1)h=`<h1>👤 ${t('s1')}</h1><label>${t('sex')}</label>${pills([['m','🙋‍♂️ '+t('m')],['f','🙋‍♀️ '+t('f')]],P.sex,"setP('sex','$v')")}<label>🎂 ${t('age')}</label><input id="age" type="number" value="${P.age}"><div class="row"><div><label>⚖️ ${t('w')}</label><input id="w" type="number" value="${P.w}"></div><div><label>📏 ${t('h')}</label><input id="h" type="number" value="${P.h}"></div></div>`+nav();
 if(st==2)h=`<h1>🎯 ${t('s3')}</h1>`+Object.keys(GI).map(g=>{const e=byId[GI[g]];return `<div class="goal ${P.goal==g?'on':''}" onclick="setP('goal','${g}')"><div class="im"><img src="${im(e,0)}"><img src="${im(e,1)}"></div><div><b>${GE[g]} ${t('goalname')[g]}</b><small>${t('gd')[g]}</small></div></div>`}).join('')+nav();
 if(st==3)h=`<h1>📈 ${t('s4')}</h1>${pills([[1,'🌱 '+t('l1')],[2,'🌿 '+t('l2')],[3,'🌳 '+t('l3')]],P.lv,"setP('lv',$v)")}<label>📍 ${t('where')}</label>${pills([['gym','🏟️ '+t('gym')],['home','🏠 '+t('home')]],P.where,"setP('where','$v')")}`+nav();
 if(st==4)h=`<h1>🗓️ ${t('s5')}</h1><div class="pills">${WD[lang].map((n,i)=>`<span class="${P.days.includes(i)?'on':''}" onclick="tgl(${i})">${n}</span>`).join('')}</div><p class="note">${t('dh')}</p>`+nav(P.days.length?'st=5;render()':'void 0','🤖 '+t('build'));

 $('#app').innerHTML=h}

// ---------- Plan builder (rule-based coach, works offline)
function build(){const p=P,n=p.days.length,g=p.goal;
 const SPL={1:[['full',['chest','quadriceps','lats','shoulders','abdominals','hamstrings']]],2:[['a',['chest','quadriceps','lats','shoulders','abdominals']],['b',['hamstrings','chest','middle back','biceps','triceps']]],
 3:[['a',['chest','quadriceps','lats','shoulders','abdominals']],['b',['hamstrings','chest','middle back','biceps','triceps']],['c',['quadriceps','shoulders','lats','glutes','abdominals']]],
 4:[['up1',['chest','lats','shoulders','biceps','triceps']],['lo1',['quadriceps','hamstrings','glutes','calves','abdominals']],['up2',['shoulders','middle back','chest','triceps','biceps']],['lo2',['hamstrings','quadriceps','glutes','calves','abdominals']]],
 5:[['push',['chest','shoulders','triceps']],['pull',['lats','middle back','biceps','traps']],['legs',['quadriceps','hamstrings','glutes','calves']],['up',['chest','lats','shoulders','abdominals']],['lo',['hamstrings','quadriceps','glutes','abdominals']]]};
 SPL[6]=[...SPL[5].slice(0,3),['push',SPL[5][0][1]],['pull',SPL[5][1][1]],['legs',SPL[5][2][1]]];SPL[7]=[...SPL[6],['full',SPL[1][0][1]]];
 const ok=p.where=='gym'?['barbell','dumbbell','machine','cable','body only','e-z curl bar']:['dumbbell','body only','bands','kettlebells'],pr=['barbell','machine','dumbbell','cable','e-z curl bar','kettlebells','bands','body only'],used=new Set();
 const pick=(m,k)=>EX.filter(e=>e[3]==m&&ok.includes(e[2])&&e[5]>0&&(LV[e[4]]||1)<=p.lv&&!used.has(e[0])).sort((a,b)=>pr.indexOf(a[2])-pr.indexOf(b[2])).slice(0,8).sort(()=>Math.random()-.5).slice(0,k).map(e=>(used.add(e[0]),e[0]));
 const plan=SPL[n].map(([k,ms])=>({k,ex:ms.flatMap((m,j)=>pick(m,(j<2?2:1)+(g=='body'&&j<3?1:0)))}));
 const bmi=p.w/((p.h/100)**2),bmr=10*p.w+6.25*p.h-5*p.age+(p.sex=='m'?5:-161),tdee=bmr*(1.2+.05*n);
 return {lang,p:{...p},plan,days:[...p.days],bmi:bmi.toFixed(1),kcal:Math.round(tdee+{mass:300,str:150,body:250,cut:-400,fit:0}[g]),pro:Math.round(p.w*(g=='cut'?2.2:1.8)),done:{}}}
function coach(){C0=build();const n=C0;$('#app').innerHTML=`<div class="ld"><h1>🤖 Coach</h1>${['c1','c2','c3'].map((k,i)=>`<p style="animation-delay:${i*.9}s">⏳ ${t(k)}</p>`).join('')}<p style="animation-delay:2.8s">✅ ${t('c4')}</p><div class="card" style="opacity:0;animation:f .5s 3.2s forwards">${GE[n.p.goal]} ${t('goalname')[n.p.goal]}: ${t('reptxt')[n.p.goal]}<br>${t('bmi')}: ${fd(n.bmi)} · ${t('kcal')}: ${fd(n.kcal)} · ${t('prot')}: ${fd(n.pro)} g</div><button class="b" style="opacity:0;animation:f .5s 3.4s forwards" onclick="fin()">${t('start')}</button></div>`}

// ---------- Calendar (home)
function dayPlan(d){const i=C.days.indexOf(wk(d));return i<0?null:C.plan[i]}
function vCal(){const y=vm.getFullYear(),m=vm.getMonth(),off=wk(new Date(y,m,1)),nd=new Date(y,m+1,0).getDate(),td=dk(new Date()),sk=dk(sel),loc=lang=='fa'?'fa-IR-u-ca-gregory':'de-DE';
 let cells=WD[lang].map(w=>`<i>${w}</i>`).join('')+'<span></span>'.repeat(off);
 for(let d=1;d<=nd;d++){const dt=new Date(y,m,d),k=dk(dt),pl=dayPlan(dt),dn=(C.done[k]||[]).length;
  cells+=`<div class="${pl?'p':''} ${dn?'d':''} ${k==td?'t':''} ${k==sk?'s':''}" onclick="sel=new Date(${y},${m},${d});vCal()">${fd(d)}${dn?`<u>✔ ${fd(dn)}</u>`:pl?'<u>💪</u>':''}</div>`}

 if(pl)body=`<h3>💪 ${t('sp')[pl.k]} <span class="note">${t('reps')}: ${t('reptxt')[C.p.goal]}</span></h3>`+pl.ex.map(id=>exRow(byId[id],`<button class="ck ${dn.includes(id)?'on':''}" onclick="chk('${id}')">${dn.includes(id)?'✔':''}</button>`)).join('');
